<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon says game</title>
    <link rel="stylesheet" href="simonplay.css">
</head>
<body>
    <h1>Simon Says Game</h1>
    <h2 >Press any key to start</h2>
    <div class="btn-container">
        <div class="line1"> 
           <div class="btn red" id="red"type="button">1</div>
           <div class="btn yellow" id="yellow"type="button">2</div>
        </div>
        <div class="line2">
           <div class="btn green"id="green"type="button">3</div>
           <div class="btn blue" id="blue"type="button">4</div>
        </div>
    </div>
<script src="simonplay.js"></script>
</body>
</html>
